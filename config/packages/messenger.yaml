framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    multiplier: 2
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []

        routing:
            # Siempre sync: sin worker, async deja los correos en messenger_messages sin error visible.
            # when@prod / when@dev no cubren APP_ENV=production u otros; mejor no depender del entorno.
            Symfony\Component\Mailer\Messenger\SendEmailMessage: sync
            Symfony\Component\Notifier\Message\ChatMessage: async
            Symfony\Component\Notifier\Message\SmsMessage: async

            # Predict async: requiere worker (`CONTAINER_ROLE=worker` en Railway).
            # Sin worker, POST /predict responde 202 y las tareas no avanzan.
            App\Message\AnalyzePredictMessage: async
