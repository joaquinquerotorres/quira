nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization', 'X-Request-Id']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/':
            # Apps nativas no aplican CORS; esto solo importa para navegadores.
            # Evitamos '*' para no abrir la API a cualquier origen web por accidente.
            allow_origin: ['%env(CORS_ALLOW_ORIGIN)%']
            allow_headers: ['Content-Type', 'Authorization', 'X-Request-Id']
            allow_methods: ['POST', 'PUT', 'GET', 'PATCH', 'DELETE', 'OPTIONS']
            max_age: 3600
