; Producción: /predict recibe JSON con vídeo en base64. En 4G la subida del body
; puede superar el default de 30s mientras PHP lee php://input (Symfony Request).
; Gemini también suma tiempo tras recibir el payload.
max_execution_time = 300
max_input_time = 300

; Base64 + deserialización + llamada al modelo
memory_limit = 512M

; Límite coherente con PredictInput legacy (vídeo base64 hasta ~56M caracteres)
post_max_size = 80M
upload_max_filesize = 80M
