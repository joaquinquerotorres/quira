version: '3'

services:
  mailhog:
    image: mailhog/mailhog
    container_name: quira_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI (ver correos en http://localhost:8025)

  database:
    image: mysql:8.0
    container_name: quira_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quira_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  db_data: