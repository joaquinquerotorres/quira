name: CI

# Tests en cada push/PR. El despliegue en producción lo gestiona Railway (u otro PaaS)
# conectado al repositorio; no hace falta rsync/SSH desde GitHub Actions.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quira_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, intl, json, mbstring, pdo_mysql, openssl, curl, xml
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Generate JWT keys
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists
        env:
          JWT_PASSPHRASE: ''

      - name: Create database
        run: php bin/console doctrine:database:create --if-not-exists
        env:
          APP_ENV: test
          APP_SECRET: ci-secret
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/quira_test?serverVersion=8.0&charset=utf8mb4

      - name: Run migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction
        env:
          APP_ENV: test
          APP_SECRET: ci-secret
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/quira_test?serverVersion=8.0&charset=utf8mb4

      - name: Execute tests
        run: php bin/phpunit
        env:
          APP_ENV: test
          APP_SECRET: ci-secret
          APP_DEBUG: 0
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/quira_test?serverVersion=8.0&charset=utf8mb4
          MAILER_DSN: null://null
          JWT_SECRET_KEY: ${{ github.workspace }}/config/jwt/private.pem
          JWT_PUBLIC_KEY: ${{ github.workspace }}/config/jwt/public.pem
          JWT_PASSPHRASE: ''
          # Secrets vacíos para tests (no se usan en unit tests)
          FIREBASE_CREDENTIALS: ''
          TWILIO_ACCOUNT_SID: ''
          TWILIO_AUTH_TOKEN: ''
          GEMINI_API_KEY: ''
          STRIPE_SECRET_KEY: sk_test_dummy
          STRIPE_WEBHOOK_SECRET: whsec_dummy
          STRIPE_PRICE_SOLVER: price_dummy
          STRIPE_PRICE_PRO: price_dummy
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          SUPABASE_BUCKET_AVATARS: avatars
          SUPABASE_BUCKET_REQUESTS: requests
